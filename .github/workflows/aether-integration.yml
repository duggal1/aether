name: Aether engine integration

on:
  push:
    branches:
      - integration/aether-additions-20260919
  pull_request:

concurrency:
  group: aether-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6.2 or newer
        run: |
          find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print
          selected=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -1)
          if [ -z "$selected" ]; then
            echo "This macOS image does not contain Xcode 26 / Swift 6.2+" >&2
            exit 1
          fi
          sudo xcode-select -s "$selected/Contents/Developer"
          swift --version
      - name: Release build
        run: swift build -c release
      - name: Real daemon capability isolation smoke
        run: python3 Scripts/verify_authority.py --bin .build/release
      - name: Hardened network regression tests
        run: swift test --filter NetworkHardeningIntegrationTests
      - name: Existing network regression tests
        run: swift test --filter NetworkTests
      - name: Benchmark
        run: swift run -c release enginebench
      - name: Full regression tests
        run: python3 Scripts/test_macos.py --timeout 1200 --maximum-rss-mib 4096
